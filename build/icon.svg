<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32323F"/>
      <stop offset="1" stop-color="#1B1B23"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1686FF"/>
      <stop offset="1" stop-color="#09D3FF"/>
    </linearGradient>
    <linearGradient id="ptr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6EEFF"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#383846"/>
      <stop offset="0.6" stop-color="#282832"/>
      <stop offset="1" stop-color="#21212A"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- nền bo góc kiểu icon macOS (824×824, chừa lề 100) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- vòng tròn trạng thái -->
  <circle cx="512" cy="512" r="262" fill="none" stroke="#17171E" stroke-width="64"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="url(#arc)" stroke-width="38" stroke-linecap="round"
          pathLength="100" stroke-dasharray="72 100" transform="rotate(-90 512 512)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="196" fill="url(#face)"/>
  <!-- núm ở cuối cung (72% vòng) -->
  <circle cx="254.6" cy="561" r="25" fill="#FFFFFF" stroke="#1686FF" stroke-width="11"/>
  <!-- con trỏ chuột -->
  <g transform="translate(520 520) scale(13.2) translate(-12.5 -12.5)">
    <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"
          fill="url(#ptr)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
